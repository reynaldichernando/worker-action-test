name: Deploy Worker to Puter

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy worker
        uses: reynaldichernando/puter-worker-deploy-action@v1.0.0-testing
        with:
          worker_name: rey-worker-api
          source_path: worker
          entry_file: index.js
          puter_path: ~/workers/rey-worker-api/
          puter_token: ${{ secrets.PUTER_TOKEN }}
